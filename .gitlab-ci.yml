stages:
    - deploy

deploy-dev:
  stage: deploy
  variables:
    GIT_STRATEGY: clone
  script:
    - sudo cp -r frontend/* /data/vnwqi/frontend/
    - sudo chown -R vnwqi:vnwqi /data/vnwqi
    - sudo su vnwqi -c "cd /data/vnwqi/frontend && python3 -m http.server 8001 & sleep 120; kill \$!"
  tags:
    - dev-srv
  environment: develop
